<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - G_City Smart Online Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Admin Content Container (Initially Hidden until password verified) -->
    <div id="adminContent" class="max-w-6xl mx-auto hidden">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-cyan-400">G_City Admin Control Panel</h1>
                <p class="text-slate-400 text-sm mt-1">Powered by Shanto Khan</p>
            </div>
            <!-- Replace index.html with your live website URL if needed -->
            <a href="https://public-id-verification.github.io/gcitysmartshop.com.bd" target="_blank" class="mt-4 md:mt-0 bg-slate-700 hover:bg-slate-600 text-cyan-400 px-4 py-2 rounded-xl border border-cyan-500/30 text-sm flex items-center gap-2 transition">
                <i class="fa-solid fa-eye"></i> View Main Shop
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Add New Product Form -->
            <div class="lg:col-span-1 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl h-fit">
                <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-cyan-400"></i> Add New Product
                </h2>
                
                <form id="productForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Product Title</label>
                        <input type="text" id="prodTitle" placeholder="e.g. T900 Ultra Smartwatch" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-cyan-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Price (BDT)</label>
                        <input type="number" id="prodPrice" placeholder="1250" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-cyan-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
                        <select id="prodCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="Smartwatch">Smartwatch</option>
                            <option value="Earbuds">Earbuds / Audio</option>
                            <option value="Accessories">Gadget & Accessories</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Image URL (ImgBB / Direct Link)</label>
                        <input type="url" id="prodImage" placeholder="https://i.ibb.co/example.jpg" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 text-sm focus:outline-none focus:border-cyan-500">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition mt-2 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save Product
                    </button>
                </form>
            </div>

            <!-- Right: Product List -->
            <div class="lg:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-cyan-400"></i> All Products List
                    </h2>
                    <button onclick="resetToDefault()" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1.5 rounded-lg border border-red-500/30 transition">
                        Reset Default Products
                    </button>
                </div>

                <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Products will load dynamically -->
                </div>
            </div>

        </div>
    </div>

    <!-- Security Check & JavaScript Sync Logic -->
    <script>
        // 🔑 SET YOUR ADMIN PASSWORD HERE
        const ADMIN_PASSWORD = "1234";

        function checkPassword() {
            const enteredPass = prompt("🔐 Enter Admin Access Password:");
            if (enteredPass === ADMIN_PASSWORD) {
                document.getElementById('adminContent').classList.remove('hidden');
                renderProducts();
            } else {
                alert("❌ Wrong Password! Access Denied.");
                document.body.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center text-center p-4">
                        <h1 class="text-3xl font-bold text-red-500 mb-2">Access Denied</h1>
                        <p class="text-slate-400 mb-6">You entered an incorrect password.</p>
                        <button onclick="location.reload()" class="bg-cyan-500 text-white px-6 py-2.5 rounded-xl hover:bg-cyan-600 transition font-semibold">
                            Try Again
                        </button>
                    </div>
                `;
            }
        }

        // Load existing products or initialize empty array
        function getProducts() {
            const data = localStorage.getItem('gcity_products');
            return data ? JSON.parse(data) : [];
        }

        function saveProducts(products) {
            localStorage.setItem('gcity_products', JSON.stringify(products));
            renderProducts();
        }

        // Render products in Admin Panel
        function renderProducts() {
            const list = document.getElementById('productList');
            const products = getProducts();

            if (products.length === 0) {
                list.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500">No custom products found. Add one from the form!</div>`;
                return;
            }

            list.innerHTML = products.map((item, index) => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex gap-4 items-center relative group">
                    <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg bg-slate-800">
                    <div class="flex-1 min-w-0">
                        <span class="text-[10px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded font-bold uppercase">${item.category || 'Gadget'}</span>
                        <h4 class="font-bold text-slate-200 text-sm truncate mt-1">${item.name}</h4>
                        <p class="text-cyan-400 font-extrabold text-sm mt-1">৳ ${item.price}</p>
                    </div>
                    <button onclick="deleteProduct(${index})" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white p-2 rounded-lg transition" title="Delete Product">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        // Form Submit Handler
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const image = document.getElementById('prodImage').value;

            const products = getProducts();
            products.unshift({
                id: Date.now(),
                name: title,
                price: parseInt(price),
                category: category,
                image: image
            });

            saveProducts(products);
            this.reset();
            alert('✅ Product successfully added to main website!');
        });

        // Delete Product
        function deleteProduct(index) {
            if (confirm('Are you sure you want to delete this product?')) {
                const products = getProducts();
                products.splice(index, 1);
                saveProducts(products);
            }
        }

        // Reset to initial state
        function resetToDefault() {
            if (confirm('This will clear all newly added products. Continue?')) {
                localStorage.removeItem('gcity_products');
                renderProducts();
            }
        }

        // Execute Password Verification on Page Load
        checkPassword();
    </script>
</body>
</html>
